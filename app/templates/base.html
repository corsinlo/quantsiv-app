<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/static/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="/static/favicon-16.png" sizes="16x16" type="image/png">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Quantsiv</title>
    <meta name="csrf-token" content="{{ csrf_token(request) }}">
    <meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false}'>
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/js/htmx.min.js" defer></script>
    {% block scripts %}{% endblock %}
</head>
<body class="bg-gray-50 text-gray-900 antialiased" hx-headers='{"X-CSRF-Token": "{{ csrf_token(request) }}"}'>
    <a href="#main-content"
       class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:bg-white focus:px-4 focus:py-2 focus:rounded-md focus:shadow underline">
        Skip to main content
    </a>
    <div class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-white shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16">
                    <div class="flex items-center">
                        <a href="/dashboard" class="inline-flex items-center">
                            <img src="/static/logo-64.png" srcset="/static/logo-64.png 2x, /static/logo-128.png 4x"
                                 width="32" height="32" alt="Quantsiv home" class="h-8 w-8">
                        </a>
                    </div>
                    {% if user %}
                    <div class="flex items-center space-x-4">
                        <span class="text-sm text-gray-700">Signed in as {{ user.login }}</span>
                        <form method="post" action="/auth/logout">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
                            <button type="submit" class="text-sm text-indigo-700 underline">Sign out</button>
                        </form>
                    </div>
                    {% endif %}
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main id="main-content" class="flex-1" tabindex="-1">
            <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
                {% block content %}{% endblock %}
            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-white border-t">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                <p class="text-sm text-gray-600">
                    Quantsiv - pre-launch preview
                </p>
            </div>
        </footer>
    </div>
</body>
</html>
