<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/static/logo-symbol.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Quantsiv</title>
    <meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false}'>
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/js/htmx.min.js" defer></script>
    {% block scripts %}{% endblock %}
</head>
<body class="bg-gray-50 text-gray-900 antialiased">
    <a href="#main-content"
       class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:bg-white focus:px-4 focus:py-2 focus:rounded-md focus:shadow underline">
        Skip to main content
    </a>
    <div class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-white shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16">
                    <div class="flex items-center">
                        <a href="/dashboard" class="inline-flex items-center">
                            <img src="/static/logo-symbol.png" alt="Quantsiv home" class="h-8 w-auto">
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main id="main-content" class="flex-1" tabindex="-1">
            <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
                {% block content %}{% endblock %}
            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-white border-t">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                <p class="text-sm text-gray-600">
                    Quantsiv - pre-launch preview
                </p>
            </div>
        </footer>
    </div>
</body>
</html>
