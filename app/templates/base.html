<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">`n    <link rel="icon" href="/static/logo-symbol.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Quantsiv</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/alpinejs@3.13.0/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">
    <div class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-white shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16">
                    <div class="flex items-center">
                        <span class="text-xl font-bold text-indigo-600"><img src="/static/logo-symbol.png" alt="Quantsiv Logo" class="h-8 w-auto"></span>
                    </div>
                    <div class="flex items-center space-x-4">
                        <!-- User info would go here in real implementation -->
                        <span class="text-sm text-gray-500">Welcome, Developer</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1">
            <div class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
                {% block content %}{% endblock %}
            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-white border-t">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                <p class="text-sm text-gray-500">
                    Quantsiv - Quantum Risk Management Platform &copy; 2026
                </p>
            </div>
        </footer>
    </div>
</body>
</html>
