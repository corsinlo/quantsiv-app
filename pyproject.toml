# Tool configuration only; dependencies live in requirements*.in / requirements*.txt.

[tool.ruff]
line-length = 100
target-version = "py312"
# Markdown is prose and reference material (the audit is an immutable record): never reformat it
extend-exclude = ["*.md", "tests/scanner/fixtures"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# The browser-based WCAG check runs in its own CI job: pytest -m a11y
addopts = "-m 'not a11y'"
markers = ["a11y: axe-core WCAG 2.1 A/AA check in a real browser (needs Playwright Chromium)"]
