name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # TODO: pin these actions to commit SHAs once the workflow is green
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=50
      - run: pip-audit -r requirements.txt
      - run: pip-audit -r requirements-scanner.txt
      # WP7 acceptance: the scanner runs to completion with networking disabled
      - name: Scanner runs offline
        run: |
          # unshare -n needs root on ubuntu-24.04 runners (unprivileged userns is restricted)
          sudo env "PATH=$PATH" unshare -n python -m quantsiv_scanner scan tests/scanner/fixtures/sample --out /tmp/qs --repository acme/sample
          test -s /tmp/qs/cbom.json && test -s /tmp/qs/findings.sarif
  postgres:
    # Migrations and the whole suite against Postgres, as deployed (A51)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quantsiv
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: alembic upgrade head && alembic check && alembic downgrade base
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quantsiv
          # Settings requires these; the migrations don't use them
          GITHUB_APP_ID: "1"
          GITHUB_APP_PRIVATE_KEY: ci
          GITHUB_WEBHOOK_SECRET: ci
          GITHUB_CLIENT_ID: ci
          GITHUB_CLIENT_SECRET: ci
          SESSION_SECRET: ci
      # The suite sets its own test settings (tests/conftest.py); only the database differs
      - run: pytest
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quantsiv
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: pytest -m a11y
  assets:
    # app/static/app.css and htmx.min.js are committed build output: fail if they drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- app/static
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [web, worker, scanner]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target ${{ matrix.target }} -t quantsiv-${{ matrix.target }} .
      - name: Scanner image scans the fixture offline
        if: matrix.target == 'scanner'
        run: |
          docker run --rm --network none -v "$PWD/tests/scanner/fixtures/sample:/src" quantsiv-scanner \
            scan /src --out /tmp/out --repository acme/sample
          docker run --rm --network none -v "$PWD/tests/scanner/fixtures/sample:/src" quantsiv-scanner \
            scan /src --json | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["findings"], d'

