name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # TODO: pin these actions to commit SHAs once the workflow is green
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=50
      - run: pip-audit -r requirements.txt
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: pytest -m a11y
  assets:
    # app/static/app.css and htmx.min.js are committed build output: fail if they drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- app/static
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [web, worker]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target ${{ matrix.target }} -t quantsiv-${{ matrix.target }} .
