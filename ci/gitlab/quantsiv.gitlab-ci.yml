# Include from your .gitlab-ci.yml:
#   include:
#     - local: ci/gitlab/quantsiv.gitlab-ci.yml
# Set QUANTSIV_IMAGE as a CI/CD variable; QUANTSIV_TOKEN as a masked variable to enable upload.
quantsiv:
  stage: test
  image: docker:27
  services: [docker:27-dind]
  variables:
    GIT_DEPTH: "1"
  script:
    - export QUANTSIV_STEP_STARTED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    - UPLOAD=""; if [ -n "$QUANTSIV_TOKEN" ]; then UPLOAD="--upload"; fi
    # Which build is this? Only a default-branch build becomes the baseline; a merge request is
    # compared against it and never becomes one.
    - export QUANTSIV_BRANCH="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-$CI_COMMIT_REF_NAME}"
    - export QUANTSIV_DEFAULT_BRANCH="$CI_DEFAULT_BRANCH"
    - export QUANTSIV_CHANGE="$([ -n "$CI_MERGE_REQUEST_IID" ] && echo true || echo false)"
    - docker run --rm
        -e QUANTSIV_TOKEN -e QUANTSIV_STEP_STARTED -e CI_PROJECT_PATH
        -e QUANTSIV_BRANCH -e QUANTSIV_DEFAULT_BRANCH -e QUANTSIV_CHANGE
        -v "$CI_PROJECT_DIR:/src" -w /src "$QUANTSIV_IMAGE"
        scan /src --out /src/quantsiv-out $UPLOAD
  artifacts:
    when: always
    paths: [quantsiv-out/]
    reports:
      sast: quantsiv-out/findings.sarif
