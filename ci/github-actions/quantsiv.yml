# .github/workflows/quantsiv.yml
# Cryptography inventory (CBOM) on every push to the default branch and every pull request.
name: quantsiv
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  security-events: write   # only for the SARIF upload to Code Scanning
  pull-requests: write     # only to post the gate explanation as a PR comment
jobs:
  cbom:
    runs-on: ubuntu-latest
    env:
      QUANTSIV_IMAGE: ${{ vars.QUANTSIV_IMAGE }}   # your registry copy of the scanner image
    steps:
      - uses: actions/checkout@v4

      # Optional: CBOMkit (Java, Python, Go). Build Java first for accurate results.
      # - run: mvn -B clean package -DskipTests
      # - uses: PQCA/cbomkit-action@v2.3.0
      #   env:
      #     CBOMKIT_LANGUAGES: java, python

      - name: Scan
        env:
          QUANTSIV_TOKEN: ${{ secrets.QUANTSIV_TOKEN }}   # optional: enables upload and the gate
          # Which build is this? Only a default-branch build becomes the baseline; a pull request
          # is compared against it and never becomes one.
          QUANTSIV_BRANCH: ${{ github.head_ref || github.ref_name }}
          QUANTSIV_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          QUANTSIV_CHANGE: ${{ github.event_name == 'pull_request' }}
        run: |
          export QUANTSIV_STEP_STARTED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          UPLOAD=""
          if [ -n "$QUANTSIV_TOKEN" ]; then UPLOAD="--upload"; fi
          docker run --rm \
            -e QUANTSIV_TOKEN -e QUANTSIV_STEP_STARTED -e GITHUB_REPOSITORY \
            -e QUANTSIV_BRANCH -e QUANTSIV_DEFAULT_BRANCH -e QUANTSIV_CHANGE \
            -v "$PWD:/src" -w /src "$QUANTSIV_IMAGE" \
            scan /src --out /src/quantsiv-out $UPLOAD

      - name: Upload CBOM, SARIF and report as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantsiv
          path: quantsiv-out/

      # With a token, the control plane's gate verdict is explained in quantsiv-out/gate/.
      # Post it on the pull request (needs `pull-requests: write` in `permissions` above).
      - name: Post the gate explanation on the pull request
        if: github.event_name == 'pull_request' && hashFiles('quantsiv-out/gate/pr_comment.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file quantsiv-out/gate/pr_comment.md

      - name: Publish findings to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: quantsiv-out/findings.sarif
